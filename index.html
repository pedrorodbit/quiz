<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Perguntados - Gerador de Quest&otilde;es</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaR1gTKlWGY6PPpVF+3j4e5M3yop2u9F1bO6g8wYqM2Sg3Ksa9DkShC0FN0G7+j3g2O03Q0Y3eUvz/dfFVg5A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvl0PPhJ3QmGmq/4y1e41mSLByM8ln3yq36+EJ3E8n3I4TqiRtDcvmKakKwQ8qHt3sMyjdSP7R2GBPV6O2nCQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  @page { size: A4; margin: 12mm 10mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Arial', 'Helvetica', sans-serif;
    font-size: 9pt;
    color: #000;
    background: #ccc;
    padding: 10px;
  }

  .controls {
    max-width: 210mm;
    margin: 0 auto 16px;
    background: #f5f5f5;
    border: 1.5px solid #444;
    padding: 12px 14px;
  }

  .controls-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .controls-header h2 { font-size: 13pt; }
  .controls-total { font-size: 9pt; color: #333; }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px 16px;
    margin-bottom: 10px;
    padding: 8px 10px;
    border: 1px solid #bbb;
    border-radius: 4px;
    background: #eee;
  }

  .cat-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9.5pt;
  }
  .cat-row label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .cat-row input[type="checkbox"] { width: 14px; height: 14px; cursor: pointer; }
  .cat-row .avail-hint { font-size: 7.5pt; color: #777; margin-left: auto; }

  .total-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    margin-bottom: 10px;
    border: 1px solid #bbb;
    border-radius: 4px;
    background: #eee;
  }
  .total-bar label { font-size: 9.5pt; font-weight: 600; }
  .total-bar input[type="number"] {
    width: 60px; padding: 3px 6px; font-size: 10pt; text-align: center;
    border: 1px solid #666; border-radius: 3px;
  }
  .total-bar .total-avail { font-size: 8.5pt; color: #555; margin-left: auto; }

  .btn-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 2px;
  }

  .btn-bar button {
    font-size: 11pt; padding: 8px 24px; cursor: pointer;
    background: #333; color: #fff; border: none;
    border-radius: 5px; font-weight: 600;
  }
  .btn-bar button:hover { background: #111; }
  .btn-bar .btn-pdf { background: #555; }
  .btn-bar .btn-pdf:hover { background: #222; }
  .btn-bar .info { font-size: 10pt; color: #333; margin-left: auto; }

  .page {
    width: 210mm;
    height: 297mm;
    margin: 0 auto;
    padding: 10mm 8mm;
    background: #fff;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 5mm;
    border-bottom: 3px dotted #999;
  }

  .page:last-child { border-bottom: none; }

  .card {
    border: 1.2px solid #222;
    border-radius: 4px;
    padding: 4mm 4.5mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    break-inside: avoid;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 2.5mm;
    padding-bottom: 1.5mm;
    border-bottom: 1.5px solid #444;
  }

  .card-category {
    font-size: 8pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: #000; line-height: 1.2;
  }

  .card-difficulty {
    font-size: 7pt; margin-left: auto; padding: 1px 7px;
    border: 1px solid #555; border-radius: 3px; font-weight: 600; color: #333;
  }

  .card-question {
    font-size: 9.5pt; font-weight: 700; margin-bottom: 2mm;
    line-height: 1.35; color: #000;
  }

  .card-options { list-style: none; margin-bottom: 2mm; }
  .card-options li { font-size: 8.5pt; line-height: 1.5; padding: 0.3mm 0; color: #111; }

  .card-answer {
    margin-top: auto; padding-top: 1.5mm; border-top: 1.2px solid #999;
  }

  .card-answer .correct {
    font-size: 8.5pt; font-weight: 700; color: #000; margin-bottom: 0.8mm;
  }

  .card-answer .explanation {
    font-size: 7.5pt; line-height: 1.35; color: #333;
  }

  .card-answer .explanation strong { font-weight: 700; color: #000; }

  .empty-msg {
    max-width: 210mm; margin: 40px auto; text-align: center;
    font-size: 13pt; color: #555;
  }

  @media (max-width: 800px) {
    body { padding: 6px; }
    .controls { padding: 10px; }
    .controls-header { flex-direction: column; align-items: flex-start; gap: 4px; }
    .cat-grid { grid-template-columns: 1fr; gap: 4px; }
    .cat-row { font-size: 10pt; }
    .total-bar { flex-wrap: wrap; }
    .btn-bar { flex-direction: column; align-items: stretch; }
    .btn-bar button { width: 100%; }
    .btn-bar .info { margin: 6px 0 0; text-align: center; }
    .page {
      width: 100%; height: auto;
      padding: 8mm 5mm; gap: 4mm; border-bottom: 3px dotted #999;
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }
    .card { padding: 3mm; }
    .card-question { font-size: 10pt; }
    .card-options li { font-size: 9pt; }
    .controls h2 { font-size: 12pt; text-align: center; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .controls { display: none; }
    .empty-msg { display: none; }
    .page {
      margin: 0; padding: 10mm 8mm;
      width: 210mm; height: 297mm;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      border-bottom: none;
      page-break-after: always;
    }
    .card { border-color: #000; border-width: 1.5px; }
    .card-header { border-bottom-color: #000; }
    .card-answer { border-top-color: #000; }
    .card-difficulty { border-color: #000; }
    .card-answer .correct { color: #000; }
    .card-answer .explanation { color: #222; }
    .card-category { color: #000; }
    .card-options li { color: #000; }
    .card-question { color: #000; }
  }
</style>
</head>
<body>

<div class="controls" id="controls">
  <div class="controls-header">
    <h2>Configurar Gera&ccedil;&atilde;o</h2>
    <span class="controls-total"><strong>288</strong> quest&otilde;es dispon&iacute;veis no total</span>
  </div>
  <div class="cat-grid" id="catGrid"></div>
  <div class="total-bar">
    <label for="totalInput">Total de quest&otilde;es:</label>
    <input type="number" id="totalInput" min="1" max="288" value="24" onchange="updateTotal()" onfocus="this.select()">
    <span class="total-avail" id="totalAvail">24 dispon&iacute;veis nas categorias selecionadas</span>
  </div>
  <div class="btn-bar">
    <button onclick="generatePages()">Gerar P&aacute;ginas</button>
    <button onclick="window.print()" id="printBtn" style="display:none">Imprimir</button>
    <button class="btn-pdf" onclick="downloadPDF()" id="pdfBtn" style="display:none">Baixar PDF</button>
    <span class="info" id="statusInfo">Nenhuma p&aacute;gina gerada</span>
  </div>
</div>

<div id="container"><div class="empty-msg">Selecione categorias e quantidades, depois clique em "Gerar P&aacute;ginas"</div></div>

<script src="questions.js?v=1785128683"></script>
<script>
const DIFFICULTIES = {
  easy: { label: 'Fácil' },
  medium: { label: 'Médio' },
  hard: { label: 'Difícil' },
};

const CATEGORIES = [
  'Arte e Cultura', 'Astronomia', 'Gastronomia', 'Tecnologia',
  'História', 'Geografia', 'Ciência', 'Música',
  'Cinema e TV', 'Esportes', 'Literatura', 'Conhecimentos Gerais',
];


const LETTERS = ['A', 'B', 'C', 'D'];
const QUESTIONS_PER_PAGE = 6;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pick(items, n) {
  const shuffled = shuffle([...items]);
  return shuffled.slice(0, Math.min(n, shuffled.length));
}

function buildCategoryUI() {
  const grid = document.getElementById('catGrid');
  CATEGORIES.forEach(cat => {
    const count = QUESTIONS.filter(q => q.category === cat).length;
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = [
      '<label><input type="checkbox" checked onchange="updateTotal()"> ', cat, '</label>',
      '<span class="avail-hint">', count, ' disp.</span>'
    ].join('');
    grid.appendChild(row);
  });
  updateTotal();
}

function updateTotal() {
  const rows = document.querySelectorAll('#catGrid .cat-row');
  let avail = 0;
  rows.forEach(row => {
    const cb = row.querySelector('input[type="checkbox"]');
    if (cb.checked) {
      const hint = row.querySelector('.avail-hint').textContent;
      avail += parseInt(hint);
    }
  });
  const totalInput = document.getElementById('totalInput');
  const max = Math.min(avail, 288);
  if (parseInt(totalInput.value) > max) totalInput.value = max;
  totalInput.max = max;

  document.getElementById('totalAvail').textContent =
    max + ' dispon\u00edveis nas categorias selecionadas';

  const total = parseInt(totalInput.value) || 0;
  const pages = Math.ceil(total / QUESTIONS_PER_PAGE);
  const info = document.getElementById('statusInfo');
  const printBtn = document.getElementById('printBtn');
  if (total > 0) {
    info.textContent = total + ' quest\u00f5es | ' + pages + ' p\u00e1gina(s)';
  } else {
    info.textContent = 'Nenhuma p\u00e1gina gerada';
    printBtn.style.display = 'none';
    document.getElementById('pdfBtn').style.display = 'none';
  }
}

function getConfig() {
  const rows = document.querySelectorAll('#catGrid .cat-row');
  const selected = [];
  rows.forEach(row => {
    const cb = row.querySelector('input[type="checkbox"]');
    if (cb.checked) {
      selected.push(row.querySelector('label').textContent.trim());
    }
  });
  if (!selected.length) return {};

  const total = parseInt(document.getElementById('totalInput').value) || 0;
  if (total <= 0) return {};

  const avail = {};
  selected.forEach(cat => {
    avail[cat] = QUESTIONS.filter(q => q.category === cat).length;
  });

  let remaining = total;
  const perCat = Math.floor(total / selected.length);
  const result = {};
  selected.forEach(cat => { result[cat] = 0; });

  selected.forEach(cat => {
    result[cat] = Math.min(perCat, avail[cat]);
    remaining -= result[cat];
  });

  for (let i = 0; i < selected.length && remaining > 0; i++) {
    const cat = selected[i];
    const canAdd = Math.min(remaining, avail[cat] - result[cat]);
    result[cat] += canAdd;
    remaining -= canAdd;
  }

  return result;
}

function buildCards(questionList) {
  const pages = [];
  for (let i = 0; i < questionList.length; i += QUESTIONS_PER_PAGE) {
    const chunk = questionList.slice(i, i + QUESTIONS_PER_PAGE);
    const pageEl = document.createElement('div');
    pageEl.className = 'page';

    chunk.forEach(q => {
      const diff = DIFFICULTIES[q.difficulty];
      const card = document.createElement('div');
      card.className = 'card';

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += '<li>' + LETTERS[idx] + ') ' + opt + '</li>';
      });

      card.innerHTML = [
        '<div class="card-header">',
        '<span class="card-category">', q.category, '</span>',
        '<span class="card-difficulty">', diff.label, '</span></div>',
        '<div class="card-question">', q.question, '</div>',
        '<ul class="card-options">', optionsHtml, '</ul>',
        '<div class="card-answer">',
        '<div class="correct">>> ', LETTERS[q.answer], ') ', q.options[q.answer], '</div>',
        '<div class="explanation"><strong>Explica\u00e7\u00e3o:</strong> ', q.explanation, '</div></div>'
      ].join('');

      pageEl.appendChild(card);
    });
    pages.push(pageEl);
  }
  return pages;
}

function generatePages() {
  const config = getConfig();
  const catNames = Object.keys(config);

  if (catNames.length === 0) {
    document.getElementById('container').innerHTML = '<div class="empty-msg">Selecione ao menos uma categoria com quantidade maior que zero.</div>';
    document.getElementById('statusInfo').textContent = 'Nenhuma p\u00e1gina gerada';
    document.getElementById('printBtn').style.display = 'none';
    document.getElementById('pdfBtn').style.display = 'none';
    return;
  }

  let selected = [];
  catNames.forEach(cat => {
    const available = QUESTIONS.filter(q => q.category === cat);
    selected = selected.concat(pick(available, config[cat]));
  });
  selected = shuffle(selected);

  const container = document.getElementById('container');
  container.innerHTML = '';

  const pages = buildCards(selected);
  pages.forEach(p => container.appendChild(p));

  const info = document.getElementById('statusInfo');
  info.textContent = selected.length + ' quest\u00f5es em ' + pages.length + ' p\u00e1gina(s)';
  document.getElementById('printBtn').style.display = '';
  document.getElementById('pdfBtn').style.display = '';

  window.scrollTo(0, 0);
}

async function downloadPDF() {
  var pages = document.querySelectorAll('#container .page');
  if (!pages.length) {
    generatePages();
    setTimeout(function () { downloadPDF(); }, 300);
    return;
  }

  var temp = document.createElement('div');
  temp.style.position = 'absolute';
  temp.style.left = '0';
  temp.style.top = '0';
  temp.style.width = '210mm';
  temp.style.zIndex = '-1';
  document.body.appendChild(temp);

  var pdf = new jspdf.jsPDF('p', 'mm', 'a4');

  for (var i = 0; i < pages.length; i++) {
    var clone = pages[i].cloneNode(true);
    clone.style.margin = '0';
    clone.style.position = 'static';
    temp.appendChild(clone);
    var canvas = await html2canvas(clone, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
    });
    temp.removeChild(clone);
    if (i > 0) pdf.addPage();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297);
  }

  document.body.removeChild(temp);
  pdf.save('quiz-perguntados.pdf');
}

buildCategoryUI();
</script>
</body>
</html>
