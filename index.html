  .toolbar {
    max-width: 210mm;

  }

  .toolbar button {
    font-size: 13pt;
    padding: 10px 32px;
    cursor: pointer;
    background: #1a5bb5;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 600;
  }

    display: inline-block;
    margin-left: 16px;
    font-size: 11pt;
    color: #555;
  }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 20px;
    padding: 10mm 8mm;
    background: #fff;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 5mm;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    page-break-after: always;
  }

  .card {
    border: 1.2px solid #222;
    border-radius: 4px;
    padding: 4mm 4.5mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    break-inside: avoid;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 2.5mm;
    padding-bottom: 1.5mm;
    border-bottom: 1.5px solid #444;
  }

  .card-category {
    font-size: 8pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #1a3a6b;
    line-height: 1.2;
  }

  .card-difficulty {
    font-size: 7pt;
    margin-left: auto;
    padding: 1px 7px;
    border: 1px solid #555;
    border-radius: 3px;
    font-weight: 600;
    color: #333;
  }

  .card-question {
    font-size: 9.5pt;
    font-weight: 700;
    margin-bottom: 2mm;
    line-height: 1.35;
    color: #000;
  }

  .card-options {
    list-style: none;
    margin-bottom: 2mm;
  }

  .card-options li {
    font-size: 8.5pt;
    line-height: 1.5;
    padding: 0.3mm 0 0.3mm 0;
    color: #111;
  }

  .card-answer {
    margin-top: auto;
    padding-top: 1.5mm;
    border-top: 1.2px dashed #888;
  }

  .card-answer .correct {
    font-size: 8.5pt;
    font-weight: 700;
    color: #005a1e;
    margin-bottom: 0.8mm;
  }

  .card-answer .explanation {
    font-size: 7.5pt;
    line-height: 1.35;
    color: #333;
  }

  .card-answer .explanation strong {
    font-weight: 700;
    color: #000;
  }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .page {
      margin: 0;
      box-shadow: none;
      padding: 10mm 8mm;
    }
    .card { border-color: #000; }
    .card-header { border-bottom-color: #000; }
    .card-answer { border-top-color: #666; }
    .card-difficulty { border-color: #000; }
  }
</style>

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pick(items, n) {
  return shuffle([...items]).slice(0, n);
}

const LETTERS = ['A', 'B', 'C', 'D'];

let pageNumber = 0;

function generatePage() {
  pageNumber++;
  document.getElementById('pageCount').textContent = `Página ${pageNumber}`;

  const selected = pick(QUESTIONS, 6);
  const container = document.getElementById('container');

  const page = document.createElement('div');
  page.className = 'page';

  selected.forEach(q => {
    const card = document.createElement('div');
    card.className = 'card';

    const diff = DIFFICULTIES[q.difficulty];

    const header = document.createElement('div');
    header.className = 'card-header';
    header.innerHTML = `
      <span class="card-category">${q.category}</span>
      <span class="card-difficulty">${diff.label}</span>
    `;

    const question = document.createElement('div');
    question.className = 'card-question';
    question.textContent = q.question;

    const options = document.createElement('ul');
    options.className = 'card-options';
    q.options.forEach((opt, idx) => {
      const li = document.createElement('li');
      li.textContent = `${LETTERS[idx]}) ${opt}`;
      options.appendChild(li);
    });

    const answer = document.createElement('div');
    answer.className = 'card-answer';
    const isCorrect = '✅';
    answer.innerHTML = `
      <div class="correct">${isCorrect} ${LETTERS[q.answer]}) ${q.options[q.answer]}</div>
      <div class="explanation"><strong>Explicação:</strong> ${q.explanation}</div>
    `;

    card.appendChild(header);
    card.appendChild(question);
    card.appendChild(options);
    card.appendChild(answer);
    page.appendChild(card);
  });

  container.innerHTML = '';
  container.appendChild(page);

  window.scrollTo(0, 0);
}

window.addEventListener('DOMContentLoaded', generatePage);
</script>
