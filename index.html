<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Perguntados - Gerador de Questões</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  /* ========================================
     GENERAL
  ======================================== */
  @page { size: A4 portrait; margin: 0; }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Arial', 'Helvetica', sans-serif;
    font-size: 9pt;
    color: #000;
    background: #eef1f5;
    padding: 10px;
  }

  /* ========================================
     INTERFACE (controls)
  ======================================== */
  .controls {
    max-width: 210mm;
    margin: 0 auto 20px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 20px 22px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  .controls-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid #eef1f5;
  }
  .controls-header h2 { font-size: 14pt; font-weight: 700; color: #1f2937; letter-spacing: -0.2px; }
  .controls-total {
    font-size: 8.5pt; font-weight: 600; color: #4f46e5;
    background: #eef2ff; padding: 4px 10px; border-radius: 999px;
  }
  .controls-total strong { font-size: 9.5pt; }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 16px;
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
  }

  .cat-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 9.5pt;
    padding: 4px 6px;
    border-radius: 6px;
    transition: background 0.15s ease;
  }
  .cat-row:hover { background: #eef2ff; }
  .cat-row label { cursor: pointer; display: flex; align-items: center; gap: 7px; color: #334155; }
  .cat-row input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: #4f46e5; }
  .cat-row .avail-hint { font-size: 7.5pt; color: #94a3b8; margin-left: auto; }

  .total-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 14px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    background: #f8fafc;
  }
  .total-bar label { font-size: 9.5pt; font-weight: 600; color: #334155; }
  .total-bar input[type="number"] {
    width: 64px; padding: 5px 8px; font-size: 10pt; text-align: center;
    border: 1px solid #cbd5e1; border-radius: 6px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .total-bar input[type="number"]:focus {
    outline: none; border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }
  .total-bar .total-avail { font-size: 8.5pt; color: #64748b; margin-left: auto; }

  .btn-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .btn-bar button {
    font-size: 10.5pt; padding: 9px 22px; cursor: pointer;
    border: none; border-radius: 8px; font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
  }
  .btn-bar button:active { transform: translateY(1px); }
  .btn-bar button:first-child { background: #4f46e5; color: #fff; }
  .btn-bar button:first-child:hover { background: #4338ca; }
  .btn-bar #printBtn, .btn-bar .btn-pdf {
    background: #fff; color: #4f46e5; border: 1.5px solid #c7d2fe;
  }
  .btn-bar #printBtn:hover, .btn-bar .btn-pdf:hover { background: #eef2ff; border-color: #4f46e5; }
  .btn-bar .info { font-size: 9.5pt; color: #64748b; margin-left: auto; }

  .btn-bar button:disabled {
    opacity: 0.7; cursor: not-allowed; transform: none;
  }
  .btn-spinner {
    display: none;
    width: 12px; height: 12px;
    margin-right: 8px;
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-top-color: #fff;
    border-radius: 50%;
    vertical-align: -2px;
    animation: btn-spin 0.7s linear infinite;
  }
  .btn-bar button:first-child .btn-spinner {
    border-color: rgba(255, 255, 255, 0.5); border-top-color: #fff;
  }
  .btn-bar #printBtn .btn-spinner, .btn-bar .btn-pdf .btn-spinner {
    border-color: rgba(79, 70, 229, 0.3); border-top-color: #4f46e5;
  }
  .btn-bar button:disabled .btn-spinner { display: inline-block; }
  @keyframes btn-spin { to { transform: rotate(360deg); } }
  .btn-progress { opacity: 0.8; font-weight: 400; }

  .empty-msg {
    max-width: 210mm; margin: 40px auto; text-align: center;
    font-size: 12.5pt; color: #94a3b8;
  }

  /* ========================================
     PAGE LAYOUT (screen + PDF capture)
     box-sizing: border-box => height INCLUI padding
     Total A4: 297mm = padding(20mm) + content(277mm)
     Grid: 2 cols, 4 rows, gap 5mm
     Each row: (277mm - 15mm gaps) / 4 = 65.5mm de teto; usamos 60mm
     de propósito, com folga (ver nota no .card de dentro do @media print)
  ======================================== */
  .page {
    width: 210mm;
    height: 297mm;
    max-height: 297mm;
    overflow: hidden;
    margin: 0 auto 8px;
    padding: 10mm 8mm;
    background: #fff;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 5mm;
  }

  /* ========================================
     CARD
     display:grid com linhas 1fr deixava uma linha crescer além dos 89mm
     quando o conteúdo era mais longo, e como .page tem overflow:hidden,
     isso cortava outros cards em vez de simplesmente esticar a página.
     Flexbox com altura fixa evita o card crescer além do previsto.
  ======================================== */
  .card {
    flex: 0 0 calc(50% - 2.5mm);
    height: 60mm;
    max-height: 60mm;
    border: 1.2px solid #222;
    border-radius: 4px;
    padding: 3.5mm 4mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 2mm;
    padding-bottom: 1.2mm;
    border-bottom: 1.2px solid #444;
    flex-shrink: 0;
  }

  .card-category {
    font-size: 7.5pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.6px; color: #000; line-height: 1.2;
  }

  .card-difficulty {
    font-size: 6.5pt; margin-left: auto; padding: 0.5px 6px;
    border: 1px solid #555; border-radius: 3px; font-weight: 600; color: #333;
    flex-shrink: 0;
  }

  .card-question {
    font-size: 9pt; font-weight: 700; margin-bottom: 1.5mm;
    line-height: 1.3; color: #000;
  }

  .card-options {
    list-style: none; margin-bottom: 1.5mm;
  }
  .card-options li {
    display: flex; align-items: center; gap: 1.5mm;
    font-size: 8pt; line-height: 1.3; padding: 0.3mm 0; color: #111;
  }
  .opt-letter {
    display: inline-flex; align-items: center; justify-content: center;
    width: 4mm; height: 4mm; min-width: 4mm;
    border: 1px solid #444; border-radius: 50%;
    font-size: 6.5pt; font-weight: 700; color: #222;
    flex-shrink: 0;
  }
  .opt-letter.filled {
    background: #000; border-color: #000; color: #fff;
  }

  .card-answer {
    margin-top: auto; padding: 1.5mm 2mm;
    background: #f0f0f0; border-radius: 3px;
    flex-shrink: 0;
  }
  .card-answer .correct {
    display: flex; align-items: center; gap: 1.5mm;
    font-size: 8pt; font-weight: 700; color: #000; margin-bottom: 0.8mm;
  }
  .card-answer .explanation {
    font-size: 7pt; line-height: 1.3; color: #333;
  }
  .card-answer .explanation strong { font-weight: 700; color: #000; }

  /* ========================================
     MOBILE (screen only)
  ======================================== */
  @media (max-width: 800px) {
    body { padding: 6px; }
    .controls { padding: 14px; border-radius: 10px; }
    .controls-header { flex-direction: column; align-items: flex-start; gap: 8px; }
    .cat-grid { grid-template-columns: 1fr; gap: 4px; }
    .cat-row { font-size: 10pt; }
    .total-bar { flex-wrap: wrap; }
    .btn-bar { flex-direction: column; align-items: stretch; }
    .btn-bar button { width: 100%; }
    .btn-bar .info { margin: 6px 0 0; text-align: center; }
    .page {
      width: 100%; height: auto;
      max-height: none;
      overflow: visible;
      padding: 8mm 5mm; gap: 4mm;
      border-bottom: 3px dotted #999;
    }
    .card {
      flex: 1 1 100%;
      height: auto;
      max-height: none;
      padding: 3mm;
    }
    .card-question { font-size: 10pt; }
    .card-options li { font-size: 9pt; }
    .controls h2 { font-size: 12pt; text-align: center; }
  }

  /* ========================================
     PRINT
     Independente do layout da tela.
     Regras próprias para garantir A4 exato.
  ======================================== */
  @media print {
    @page { size: A4 portrait; margin: 0; }

    body {
      background: #fff; padding: 0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .controls { display: none; }
    .empty-msg { display: none; }

    .page {
      width: 210mm;
      height: 297mm;
      max-height: 297mm;
      overflow: hidden;
      margin: 0;
      padding: 10mm 8mm;
      background: #fff;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 5mm;
      border: none;
      page-break-after: always;
      break-after: page;
    }
    .page:last-child {
      page-break-after: auto;
      break-after: auto;
    }

    /* display:grid + page-break-after tem bugs conhecidos no preview de
       impressão do Chrome (conteúdo cortado/página em branco); flexbox com
       tamanho fixo por card é o layout que paginação de impressão lida bem.
       Altura do card com folga (teto seria 65.5mm p/ 4 linhas, usamos
       60mm): o motor de paginação decide a quebra pela altura NÃO cortada
       do conteúdo, então zero folga fazia qualquer variação de renderização
       (borda, arredondamento) empurrar o ponto de quebra, deslocando cada
       página seguinte um pouco mais para baixo. */
    .card {
      flex: 0 0 calc(50% - 2.5mm);
      height: 60mm;
      max-height: 60mm;
      border: 1.2px solid #000;
      padding: 3.5mm 4mm;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .card-header { border-bottom-color: #000; }
    .card-answer { background: #ececec; }
    .card-difficulty { border-color: #000; }
    .opt-letter { border-color: #000; }
    .opt-letter.filled { background: #000; border-color: #000; }
    .card-answer .correct { color: #000; }
    .card-answer .explanation { color: #222; }
    .card-category { color: #000; }
    .card-options li { color: #000; }
    .card-question { color: #000; }
  }
</style>
</head>
<body>

<div class="controls" id="controls">
  <div class="controls-header">
    <h2>Crie seu Quiz</h2>
    <span class="controls-total"><strong>576</strong> questões disponíveis no total</span>
  </div>
  <div class="cat-grid" id="catGrid"></div>
  <div class="total-bar">
    <label for="totalInput">Total de questões:</label>
    <input type="number" id="totalInput" min="1" value="48" onchange="updateTotal()" onfocus="this.select()">
    <span class="total-avail" id="totalAvail">0 disponíveis nas categorias selecionadas</span>
  </div>
  <div class="btn-bar">
    <button onclick="generatePages()">Gerar Páginas</button>
    <button onclick="printPDF()" id="printBtn" style="display:none"><span class="btn-spinner"></span>Imprimir<span class="btn-progress" id="printProgress"></span></button>
    <button class="btn-pdf" onclick="downloadPDF()" id="pdfBtn" style="display:none"><span class="btn-spinner"></span>Baixar PDF<span class="btn-progress" id="pdfProgress"></span></button>
    <span class="info" id="statusInfo">Nenhuma página gerada</span>
  </div>
</div>

<div id="container"><div class="empty-msg">Selecione categorias e quantidades, depois clique em "Gerar Páginas"</div></div>

<script src="questions.js?v=1785208345"></script>
<script>
const DIFFICULTIES = {
  easy: { label: 'Fácil' },
  medium: { label: 'Médio' },
  hard: { label: 'Difícil' },
};

const CATEGORIES = [
  'Arte e Cultura', 'Astronomia', 'Gastronomia', 'Tecnologia',
  'História', 'Geografia', 'Ciência', 'Música',
  'Cinema e TV', 'Esportes', 'Literatura', 'Conhecimentos Gerais',
];


const LETTERS = ['A', 'B', 'C', 'D'];
const QUESTIONS_PER_PAGE = 8;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pick(items, n) {
  const shuffled = shuffle([...items]);
  return shuffled.slice(0, Math.min(n, shuffled.length));
}

function buildCategoryUI() {
  const grid = document.getElementById('catGrid');
  CATEGORIES.forEach(cat => {
    const count = QUESTIONS.filter(q => q.category === cat).length;
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = [
      '<label><input type="checkbox" checked onchange="updateTotal()"> ', cat, '</label>',
      '<span class="avail-hint">', count, ' disp.</span>'
    ].join('');
    grid.appendChild(row);
  });
  updateTotal();
}

function updateTotal() {
  const rows = document.querySelectorAll('#catGrid .cat-row');
  let avail = 0;
  rows.forEach(row => {
    const cb = row.querySelector('input[type="checkbox"]');
    if (cb.checked) {
      const hint = row.querySelector('.avail-hint').textContent;
      avail += parseInt(hint);
    }
  });
  const totalInput = document.getElementById('totalInput');
  const max = Math.min(avail, 576);
  if (parseInt(totalInput.value) > max) totalInput.value = max;
  totalInput.max = max;

  document.getElementById('totalAvail').textContent =
    max + ' dispon\u00edveis nas categorias selecionadas';

  const total = parseInt(totalInput.value) || 0;
  const pages = Math.ceil(total / QUESTIONS_PER_PAGE);
  const info = document.getElementById('statusInfo');
  if (total > 0) {
    info.textContent = total + ' quest\u00f5es | ' + pages + ' p\u00e1gina(s)';
  } else {
    info.textContent = 'Nenhuma p\u00e1gina gerada';
    document.getElementById('printBtn').style.display = 'none';
    document.getElementById('pdfBtn').style.display = 'none';
  }
}

function getConfig() {
  const rows = document.querySelectorAll('#catGrid .cat-row');
  const selected = [];
  rows.forEach(row => {
    const cb = row.querySelector('input[type="checkbox"]');
    if (cb.checked) {
      selected.push(row.querySelector('label').textContent.trim());
    }
  });
  if (!selected.length) return {};

  const total = parseInt(document.getElementById('totalInput').value) || 0;
  if (total <= 0) return {};

  const avail = {};
  selected.forEach(cat => {
    avail[cat] = QUESTIONS.filter(q => q.category === cat).length;
  });

  let remaining = total;
  const perCat = Math.floor(total / selected.length);
  const result = {};
  selected.forEach(cat => { result[cat] = 0; });

  selected.forEach(cat => {
    result[cat] = Math.min(perCat, avail[cat]);
    remaining -= result[cat];
  });

  for (let i = 0; i < selected.length && remaining > 0; i++) {
    const cat = selected[i];
    const canAdd = Math.min(remaining, avail[cat] - result[cat]);
    result[cat] += canAdd;
    remaining -= canAdd;
  }

  return result;
}

function buildCards(questionList) {
  const pages = [];
  for (let i = 0; i < questionList.length; i += QUESTIONS_PER_PAGE) {
    const chunk = questionList.slice(i, i + QUESTIONS_PER_PAGE);
    const pageEl = document.createElement('div');
    pageEl.className = 'page';

    chunk.forEach(q => {
      const diff = DIFFICULTIES[q.difficulty];
      const card = document.createElement('div');
      card.className = 'card';

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += '<li><span class="opt-letter">' + LETTERS[idx] + '</span>' + opt + '</li>';
      });

      card.innerHTML = [
        '<div class="card-header">',
        '<span class="card-category">', q.category, '</span>',
        '<span class="card-difficulty">', diff.label, '</span></div>',
        '<div class="card-question">', q.question, '</div>',
        '<ul class="card-options">', optionsHtml, '</ul>',
        '<div class="card-answer">',
        '<div class="correct"><span class="opt-letter filled">', LETTERS[q.answer], '</span>', q.options[q.answer], '</div>',
        '<div class="explanation"><strong>Explica\u00e7\u00e3o:</strong> ', q.explanation, '</div></div>'
      ].join('');

      pageEl.appendChild(card);
    });
    pages.push(pageEl);
  }
  return pages;
}

function generatePages() {
  const config = getConfig();
  const catNames = Object.keys(config);

  if (catNames.length === 0) {
    document.getElementById('container').innerHTML = '<div class="empty-msg">Selecione ao menos uma categoria com quantidade maior que zero.</div>';
    document.getElementById('statusInfo').textContent = 'Nenhuma p\u00e1gina gerada';
    document.getElementById('printBtn').style.display = 'none';
    document.getElementById('pdfBtn').style.display = 'none';
    return;
  }

  let selected = [];
  catNames.forEach(cat => {
    const available = QUESTIONS.filter(q => q.category === cat);
    selected = selected.concat(pick(available, config[cat]));
  });
  selected = shuffle(selected);

  const container = document.getElementById('container');
  container.innerHTML = '';

  const pages = buildCards(selected);
  pages.forEach(p => container.appendChild(p));

  const info = document.getElementById('statusInfo');
  info.textContent = selected.length + ' quest\u00f5es em ' + pages.length + ' p\u00e1gina(s)';
  document.getElementById('printBtn').style.display = '';
  document.getElementById('pdfBtn').style.display = '';

  window.scrollTo(0, 0);
}

async function renderPDF(onProgress) {
  var pages = document.querySelectorAll('#container .page');
  if (!pages.length) {
    generatePages();
    return null;
  }

  if (typeof html2canvas === 'undefined' || typeof jspdf === 'undefined') {
    throw new Error('Bibliotecas n\u00e3o carregadas. Verifique conex\u00e3o com a internet.');
  }

  var temp = document.createElement('div');
  temp.style.position = 'fixed';
  temp.style.left = '-9999px';
  temp.style.top = '0';
  temp.style.width = '210mm';
  document.body.appendChild(temp);

  var pdf = new jspdf.jsPDF('p', 'mm', 'a4');

  for (var i = 0; i < pages.length; i++) {
    var clone = pages[i].cloneNode(true);
    clone.style.margin = '0';
    clone.style.position = 'static';
    clone.style.width = '210mm';
    clone.style.height = '297mm';
    clone.style.maxHeight = '297mm';
    clone.style.overflow = 'hidden';
    // Força o layout desktop (2 colunas fixas) mesmo se a página estiver
    // sendo capturada com a janela estreita, onde a media query mobile
    // trocaria os cards para empilhados de uma coluna só.
    var clonedCards = clone.querySelectorAll('.card');
    for (var j = 0; j < clonedCards.length; j++) {
      clonedCards[j].style.flex = '0 0 calc(50% - 2.5mm)';
      clonedCards[j].style.height = '60mm';
      clonedCards[j].style.maxHeight = '60mm';
    }
    temp.appendChild(clone);
    var canvas = await html2canvas(clone, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
    });
    temp.removeChild(clone);
    if (i > 0) pdf.addPage();
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 210, 297);
    if (onProgress) onProgress(i + 1, pages.length);
  }

  document.body.removeChild(temp);
  return pdf;
}

async function downloadPDF() {
  var info = document.getElementById('statusInfo');
  var btn = document.getElementById('pdfBtn');
  var progress = document.getElementById('pdfProgress');
  var originalText = info.textContent;
  info.textContent = 'Gerando PDF...';
  btn.disabled = true;

  try {
    var pdf = await renderPDF(function (done, total) {
      progress.textContent = ' (' + done + '/' + total + ')';
    });
    if (pdf) {
      pdf.save('quiz-perguntados.pdf');
      info.textContent = originalText;
    } else {
      setTimeout(function () { downloadPDF(); }, 300);
    }
  } catch (e) {
    info.textContent = 'Erro: ' + e.message;
    console.error(e);
  } finally {
    btn.disabled = false;
    progress.textContent = '';
  }
}

async function printPDF() {
  // window.print() depende do @media print/page-break do navegador, cujas
  // margens e paginação variam demais entre navegador/SO/impressora. Em vez
  // disso, reaproveita o mesmo PDF (html2canvas + jsPDF) que "Baixar PDF"
  // já gera de forma confiável.
  //
  // Chamar .print() dentro de um iframe/aba apontando pro PDF não funciona:
  // o visualizador de PDF nativo do Chrome roda em contexto isolado e
  // acessar seu contentWindow lança SecurityError. A alternativa confiável
  // é abrir o PDF numa nova aba e deixar o próprio visualizador (com botão
  // de impressão nativo) cuidar do resto — sem depender de CSS de página.
  //
  // A aba só abre depois do PDF pronto (progresso fica só no botão, ver
  // downloadPDF). Isso significa chamar window.open() depois de um await
  // longo (até dezenas de segundos em quizzes grandes) — o navegador pode
  // não reconhecer mais isso como resposta direta ao clique e bloquear
  // como pop-up, silenciosamente. Se isso acontecer com frequência, volte
  // a abrir a aba em branco antes do await (ver histórico do commit).
  var info = document.getElementById('statusInfo');
  var btn = document.getElementById('printBtn');
  var progress = document.getElementById('printProgress');
  var originalText = info.textContent;
  btn.disabled = true;

  info.textContent = 'Preparando impressão...';
  try {
    var pdf = await renderPDF(function (done, total) {
      progress.textContent = ' (' + done + '/' + total + ')';
    });
    if (!pdf) {
      setTimeout(function () { printPDF(); }, 300);
      return;
    }
    var win = window.open(pdf.output('bloburl'), '_blank');
    if (!win) {
      info.textContent = 'Permita pop-ups neste site para imprimir.';
      return;
    }
    info.textContent = originalText;
  } catch (e) {
    info.textContent = 'Erro: ' + e.message;
    console.error(e);
  } finally {
    btn.disabled = false;
    progress.textContent = '';
  }
}

buildCategoryUI();
</script>
</body>
</html>
