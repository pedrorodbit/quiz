<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Perguntados - Gerador de Quest&otilde;es</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  @page { size: A4; margin: 12mm 10mm; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', 'Arial', 'Helvetica', sans-serif;
    font-size: 9pt;
    color: #000;
    background: #ccc;
    padding: 10px;
  }

  .controls {
    max-width: 210mm;
    margin: 0 auto 16px;
    background: #f5f5f5;
    border: 1.5px solid #444;
    padding: 12px 14px;
  }

  .controls h2 { font-size: 13pt; margin-bottom: 10px; }

  .cat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 20px;
    margin-bottom: 12px;
  }

  .cat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 9.5pt;
  }

  .cat-row label { cursor: pointer; display: flex; align-items: center; gap: 5px; }
  .cat-row input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; }
  .cat-row input[type="number"] {
    width: 44px; padding: 2px 4px; font-size: 9pt; text-align: center;
    border: 1px solid #666;
  }
  .cat-row .total-hint { font-size: 7.5pt; color: #555; margin-left: auto; }

  .btn-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn-bar button {
    font-size: 11pt; padding: 8px 24px; cursor: pointer;
    background: #333; color: #fff; border: none;
    border-radius: 5px; font-weight: 600;
  }
  .btn-bar button:hover { background: #111; }
  .btn-bar .btn-pdf { background: #555; }
  .btn-bar .btn-pdf:hover { background: #222; }
  .btn-bar .info { font-size: 10pt; color: #333; margin-left: auto; }

  .page {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto 20px;
    padding: 10mm 8mm;
    background: #fff;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 5mm;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }

  .card {
    border: 1.2px solid #222;
    border-radius: 4px;
    padding: 4mm 4.5mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    break-inside: avoid;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 2.5mm;
    padding-bottom: 1.5mm;
    border-bottom: 1.5px solid #444;
  }

  .card-category {
    font-size: 8pt; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.8px; color: #000; line-height: 1.2;
  }

  .card-difficulty {
    font-size: 7pt; margin-left: auto; padding: 1px 7px;
    border: 1px solid #555; border-radius: 3px; font-weight: 600; color: #333;
  }

  .card-question {
    font-size: 9.5pt; font-weight: 700; margin-bottom: 2mm;
    line-height: 1.35; color: #000;
  }

  .card-options { list-style: none; margin-bottom: 2mm; }
  .card-options li { font-size: 8.5pt; line-height: 1.5; padding: 0.3mm 0; color: #111; }

  .card-answer {
    margin-top: auto; padding-top: 1.5mm; border-top: 1.2px solid #999;
  }

  .card-answer .correct {
    font-size: 8.5pt; font-weight: 700; color: #000; margin-bottom: 0.8mm;
  }

  .card-answer .explanation {
    font-size: 7.5pt; line-height: 1.35; color: #333;
  }

  .card-answer .explanation strong { font-weight: 700; color: #000; }

  .empty-msg {
    max-width: 210mm; margin: 40px auto; text-align: center;
    font-size: 13pt; color: #555;
  }

  @media (max-width: 800px) {
    body { padding: 6px; }
    .controls { padding: 10px; }
    .cat-grid { grid-template-columns: 1fr; gap: 5px; }
    .cat-row { font-size: 10pt; flex-wrap: wrap; }
    .cat-row input[type="number"] { width: 50px; }
    .btn-bar { flex-direction: column; align-items: stretch; }
    .btn-bar button { width: 100%; }
    .btn-bar .info { margin: 6px 0 0; text-align: center; }
    .page {
      width: 100%; min-height: auto;
      padding: 8mm 5mm; gap: 4mm;
      grid-template-columns: 1fr;
      grid-template-rows: auto;
    }
    .card { padding: 3mm; }
    .card-question { font-size: 10pt; }
    .card-options li { font-size: 9pt; }
    .controls h2 { font-size: 12pt; text-align: center; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .controls { display: none; }
    .empty-msg { display: none; }
    .page {
      margin: 0; box-shadow: none; padding: 10mm 8mm;
      width: 210mm; min-height: 297mm;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      page-break-after: always;
    }
    .card { border-color: #000; border-width: 1.5px; }
    .card-header { border-bottom-color: #000; }
    .card-answer { border-top-color: #000; }
    .card-difficulty { border-color: #000; }
    .card-answer .correct { color: #000; }
    .card-answer .explanation { color: #222; }
    .card-category { color: #000; }
    .card-options li { color: #000; }
    .card-question { color: #000; }
  }
</style>
</head>
<body>

<div class="controls" id="controls">
  <h2>Configurar Gera&ccedil;&atilde;o</h2>
  <div class="cat-grid" id="catGrid"></div>
  <div class="btn-bar">
    <button onclick="generatePages()">Gerar P&aacute;ginas</button>
    <button class="btn-pdf" onclick="downloadPDF()">Baixar PDF</button>
    <button onclick="window.print()" id="printBtn" style="display:none">Imprimir</button>
    <span class="info" id="statusInfo">Nenhuma p&aacute;gina gerada</span>
  </div>
</div>

<div id="container"><div class="empty-msg">Selecione categorias e quantidades, depois clique em "Gerar P&aacute;ginas"</div></div>

<script>

  { category: 'Arte e Cultura', question: 'Qual é o livro mais vendido da história, excluindo textos religiosos?', options: ['Dom Quixote', 'O Pequeno Príncipe', 'Um Conto de Duas Cidades', 'O Senhor dos Anéis'], answer: 0, explanation: 'Dom Quixote, de Miguel de Cervantes, é considerado o livro mais vendido da história com mais de 500 milhões de cópias.', difficulty: 'medium' },

  { category: 'Arte e Cultura', question: 'Qual movimento artístico é conhecido pelo uso de figuras geométricas e formas abstratas?', options: ['Barroco', 'Renascimento', 'Cubismo', 'Romantismo'], answer: 2, explanation: 'O Cubismo, iniciado por Picasso e Braque, fragmenta figuras em formas geométricas.', difficulty: 'easy' },
  { category: 'Arte e Cultura', question: 'Qual foi o primeiro filme a ganhar o Oscar de Melhor Filme?', options: ['Wings (Asas)', 'O Cantor de Jazz', 'Casablanca', 'E o Vento Levou'], answer: 0, explanation: 'Wings (1927) foi o primeiro filme a vencer o Oscar de Melhor Filme em 1929.', difficulty: 'hard' },
  { category: 'Arte e Cultura', question: 'No Brasil, qual destes é considerado o patrono da independência literária?', options: ['José de Alencar', 'Machado de Assis', 'Gonçalves Dias', 'Olavo Bilac'], answer: 1, explanation: 'Machado de Assis é o maior nome da literatura brasileira, fundador da Academia Brasileira de Letras.', difficulty: 'medium' },

  { category: 'Arte e Cultura', question: 'Em que ano ocorreu a Semana de Arte Moderna no Brasil?', options: ['1918', '1920', '1922', '1924'], answer: 2, explanation: 'A Semana de Arte Moderna aconteceu em fevereiro de 1922 no Teatro Municipal de São Paulo.', difficulty: 'hard' },

  // === ASTRONOMIA ===

  { category: 'Astronomia', question: 'Em que ano o homem pisou na Lua pela primeira vez?', options: ['1965', '1967', '1969', '1971'], answer: 2, explanation: 'Em 20 de julho de 1969, Neil Armstrong pisou na Lua na missão Apollo 11.', difficulty: 'easy' },

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pick(items, n) {
  const shuffled = shuffle([...items]);
  return shuffled.slice(0, Math.min(n, shuffled.length));
}

    const count = QUESTIONS.filter(q => q.category === cat).length;
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = [
      '<label><input type="checkbox" checked onchange="updateTotal()"> ', cat, '</label>',
      '<input type="number" min="0" max="', count, '" value="', Math.min(6, count),
      '" onchange="updateTotal()" onfocus="this.select()">',
      '<span class="total-hint">(', count, ' disp.)</span>'
    ].join('');
    grid.appendChild(row);
  });
  updateTotal();
}

function updateTotal() {
  const rows = document.querySelectorAll('#catGrid .cat-row');
  let total = 0;
  rows.forEach(row => {
    const cb = row.querySelector('input[type="checkbox"]');
    const num = row.querySelector('input[type="number"]');
    if (cb.checked) total += parseInt(num.value) || 0;
  });
  const info = document.getElementById('statusInfo');
  const pages = Math.ceil(total / QUESTIONS_PER_PAGE);
  const printBtn = document.getElementById('printBtn');
  if (total > 0) {
    info.textContent = total + ' quest\u00f5es | ' + pages + ' p\u00e1gina(s)';
  } else {
    info.textContent = 'Nenhuma p\u00e1gina gerada';
    printBtn.style.display = 'none';
  }
}

function getConfig() {
  const rows = document.querySelectorAll('#catGrid .cat-row');
  const config = {};
  rows.forEach(row => {
    const cb = row.querySelector('input[type="checkbox"]');
    const num = row.querySelector('input[type="number"]');
    if (cb.checked && parseInt(num.value) > 0) {
      const label = row.querySelector('label').textContent.trim();
      config[label] = parseInt(num.value);
    }
  });
  return config;
}

function buildCards(questionList) {
  const pages = [];
  for (let i = 0; i < questionList.length; i += QUESTIONS_PER_PAGE) {
    const chunk = questionList.slice(i, i + QUESTIONS_PER_PAGE);
    const pageEl = document.createElement('div');
    pageEl.className = 'page';

    chunk.forEach(q => {
      const diff = DIFFICULTIES[q.difficulty];
      const card = document.createElement('div');
      card.className = 'card';

      let optionsHtml = '';
      q.options.forEach((opt, idx) => {
        optionsHtml += '<li>' + LETTERS[idx] + ') ' + opt + '</li>';
      });

      card.innerHTML = [
        '<div class="card-header">',
        '<span class="card-category">', q.category, '</span>',
        '<span class="card-difficulty">', diff.label, '</span></div>',
        '<div class="card-question">', q.question, '</div>',
        '<ul class="card-options">', optionsHtml, '</ul>',
        '<div class="card-answer">',
        '<div class="correct">>> ', LETTERS[q.answer], ') ', q.options[q.answer], '</div>',
        '<div class="explanation"><strong>Explica\u00e7\u00e3o:</strong> ', q.explanation, '</div></div>'
      ].join('');

      pageEl.appendChild(card);
    });
    pages.push(pageEl);
  }
  return pages;
}

function generatePages() {
  const config = getConfig();
  const catNames = Object.keys(config);

  if (catNames.length === 0) {
    document.getElementById('container').innerHTML = '<div class="empty-msg">Selecione ao menos uma categoria com quantidade maior que zero.</div>';
    document.getElementById('statusInfo').textContent = 'Nenhuma p\u00e1gina gerada';
    document.getElementById('printBtn').style.display = 'none';
    return;
  }

  let selected = [];
  catNames.forEach(cat => {
    const available = QUESTIONS.filter(q => q.category === cat);
    selected = selected.concat(pick(available, config[cat]));
  });
  selected = shuffle(selected);

  const container = document.getElementById('container');
  container.innerHTML = '';

  const pages = buildCards(selected);
  pages.forEach(p => container.appendChild(p));

  const info = document.getElementById('statusInfo');
  info.textContent = selected.length + ' quest\u00f5es em ' + pages.length + ' p\u00e1gina(s)';
  document.getElementById('printBtn').style.display = '';

  window.scrollTo(0, 0);
}

function downloadPDF() {
  var pages = document.querySelectorAll('.page');

  if (!pages.length) {
    generatePages();
    setTimeout(function () { downloadPDF(); }, 300);
    return;
  }

  var { jsPDF } = window.jspdf;
  var doc = new jsPDF({
    unit: 'mm',
    format: 'a4',
    orientation: 'portrait',
    compress: true,
  });
  var pageIndex = 0;

  function renderNext() {
    if (pageIndex >= pages.length) {
      doc.save('quiz-perguntados.pdf');
      return;
    }

    html2canvas(pages[pageIndex], {
      scale: 2,
      useCORS: true,
      letterRendering: true,
      width: Math.round(210 * 3.7795),
      height: Math.round(297 * 3.7795),
    }).then(function (canvas) {
      var imgData = canvas.toDataURL('image/jpeg', 0.95);
      if (pageIndex > 0) doc.addPage();
      doc.addImage(imgData, 'JPEG', 0, 0, 210, 297);
      pageIndex++;
      renderNext();
    });
  }

  renderNext();
}

buildCategoryUI();
</script>
