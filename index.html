<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Perguntados - Gerador de Questões</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAOnx5S09ydFYWWNSfcEqDTTHgtNA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="style.css?v=1785216262">
</head>
<body>

<div class="controls" id="controls">
  <div class="controls-header">
    <h2>Crie seu Quiz</h2>
    <span class="controls-total"><strong>576</strong> questões disponíveis no total</span>
  </div>
  <div class="cat-grid" id="catGrid">Carregando questões...</div>
  <div class="total-bar">
    <label for="totalInput">Total de questões:</label>
    <input type="number" id="totalInput" min="1" value="48" onchange="updateTotal()" onfocus="this.select()">
    <span class="total-avail" id="totalAvail">0 disponíveis nas categorias selecionadas</span>
  </div>
  <div class="btn-bar">
    <button onclick="generatePages()">Gerar Páginas</button>
    <button onclick="printPDF()" id="printBtn" style="display:none"><span class="btn-spinner"></span>Imprimir<span class="btn-progress" id="printProgress"></span></button>
    <button class="btn-pdf" onclick="downloadPDF()" id="pdfBtn" style="display:none"><span class="btn-spinner"></span>Baixar PDF<span class="btn-progress" id="pdfProgress"></span></button>
    <span class="info" id="statusInfo">Nenhuma página gerada</span>
  </div>
</div>

<div id="container"><div class="empty-msg">Selecione categorias e quantidades, depois clique em "Gerar Páginas"</div></div>

<script src="app.js?v=1785216262"></script>
</body>
</html>
